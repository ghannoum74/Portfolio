<div data-style="content">
  <h1 data-style="heading">Entering my world</h1>

  <p id="loading-status" data-style="status" aria-live="polite">
    Initializing...
  </p>

  <div
    id="loading-progress"
    data-style="progress"
    role="progressbar"
    aria-label="World loading progress"
    aria-valuemin="0"
    aria-valuemax="100"
    aria-valuenow="0"
  >
    <div id="loading-progress-fill" data-style="progressFill"></div>
  </div>

  <div data-style="details">
    <span id="loading-file" data-style="filename"> Preparing assets </span>

    <span id="loading-percent" data-style="percentage"> 0% </span>
  </div>

  <p id="loading-error" data-style="error" role="alert" hidden></p>
</div>
