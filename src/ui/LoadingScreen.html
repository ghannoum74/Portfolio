<div class="loading-screen_content">
  <h1 class="loading-screen_title">Entering my world</h1>

  <p id="loading-status" class="loading-screen_status" aria-live="polite">
    Initializing...
  </p>

  <div
    id="loading-progress"
    class="loading-screen_progress"
    role="progressbar"
    aria-label="Startup assets loaded"
    aria-valuemin="0"
    aria-valuemax="9"
    aria-valuenow="0"
  >
    <div id="loading-progress-fill" class="loading-screen_progress-fill"></div>
  </div>

  <div class="loading-screen_details">
    <span id="loading-file"> Preparing assets </span>

    <span id="loading-count"> 0 / 9 assets </span>
  </div>

  <p id="loading-error" class="loading-screen_error" role="alert" hidden></p>
</div>
