<section class="rules-controls">
  <h3>Controls</h3>

  <div class="control-row">
    <div class="control-keys">
      <kbd>W</kbd>
      <kbd>S</kbd>
    </div>

    <p>Move forward and backward.</p>
  </div>

  <div class="control-row">
    <div class="control-keys">
      <kbd>A</kbd>
      <kbd>D</kbd>
    </div>

    <p>Turn left and right.</p>
  </div>

  <div class="control-row">
    <div class="control-keys">
      <kbd>Shift</kbd>
    </div>

    <p>Run — when walking suddenly feels too safe.</p>
  </div>

  <div class="control-row">
    <div class="control-keys">
      <kbd>Space</kbd>
    </div>

    <p>Jump. Gravity has agreed to cooperate... mostly.</p>
  </div>
</section>
