<div class="dialogue-box" data-dialogue-root aria-hidden="true">
  <section
    class="dialogue-box_panel"
    role="dialog"
    aria-labelledby="dialogue-speaker"
  >
    <div class="dialogue-box_speaker">
      <strong id="dialogue-speaker" data-dialogue-speaker></strong>

      <span data-dialogue-company></span>
    </div>

    <p class="dialogue-box_text" data-dialogue-text></p>

    <button class="dialogue-box_next" type="button" data-dialogue-next>
      <span data-dialogue-action> Continue </span>

      <kbd>E</kbd>

      <span class="dialogue-box_arrow" aria-hidden="true"> ▼ </span>
    </button>
  </section>
</div>
