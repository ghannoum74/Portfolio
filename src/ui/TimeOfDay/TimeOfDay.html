<button
  type="button"
  class="world-time_toggle"
  aria-expanded="false"
  aria-controls="world-time-panel"
  data-time-toggle
>
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <circle cx="12" cy="12" r="4" />
    <path
      d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"
    />
  </svg>
  <span
    ><span class="world-time_caption">World time</span
    ><span class="world-time_current" data-time-current></span
  ></span>
  <svg class="world-time_chevron" viewBox="0 0 24 24" aria-hidden="true">
    <path d="m8 10 4 4 4-4" />
  </svg>
</button>
<section
  id="world-time-panel"
  class="world-time_panel"
  aria-label="Choose the world's time"
  hidden
  data-time-panel
>
  <p class="world-time_heading">Same world. A different light.</p>
  <div class="world-time_presets" role="group" aria-label="Time of day presets">
    <button type="button" data-time-hour="8" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path
          d="M2 18h20M6 14a6 6 0 0 1 12 0M12 3v3M3 7l2 2m14 0 2-2M9 21h6"
        /></svg
      >Morning
    </button>
    <button type="button" data-time-hour="12" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="4" />
        <path
          d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"
        /></svg
      >Day
    </button>
    <button type="button" data-time-hour="18" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path
          d="M2 18h20M6 15a6 6 0 0 1 12 0M12 3v6m-3-3 3 3 3-3M3 9l2 2m14 0 2-2M9 21h6"
        /></svg
      >Sunset
    </button>
    <button type="button" data-time-hour="23" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M20 15A9 9 0 0 1 9 4a9 9 0 1 0 11 11Z" />
        <path d="M18 3v4m-2-2h4" /></svg
      >Night
    </button>
  </div>
  <div class="world-time_slider-label">
    <label for="world-time-hour">Pick a time</label
    ><output for="world-time-hour" data-time-output></output>
  </div>
  <input
    id="world-time-hour"
    class="world-time_slider"
    type="range"
    min="0"
    max="23.99"
    step="0.01"
    data-time-slider
  />
  <button
    type="button"
    class="world-time_local"
    aria-pressed="true"
    data-time-local
  >
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="12" r="9" />
      <path d="M12 7v5l3 2" />
    </svg>
    Use my local time
    <span class="world-time_check" aria-hidden="true">✓</span>
  </button>
</section>
