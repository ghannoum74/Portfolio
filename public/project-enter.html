<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title>Entering project…</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Coiny&display=swap" rel="stylesheet" />
  <style>
    :root { font-family: "Coiny", system-ui, sans-serif; color: #5c4534; background: #f3e7c2; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body { display: grid; place-items: center; }
    .grain { position: fixed; inset: 0; background: radial-gradient(circle at 15% 20%, #fff5df, #e1cca8 90%); }
    .grain::before { content: ""; position: absolute; inset: 0; opacity: 0.3;
      background-image: repeating-linear-gradient(0deg, transparent 0 8px, #bca27d11 8px 9px); }
    .shell { position: relative; width: min(92vw, 920px); text-align: center; }
    .eyebrow { margin: 0 0 15px; color: #426d68; font-size: clamp(12px, 2vw, 16px); letter-spacing: 0.12em; }
    h1 { margin: 0 0 30px; font-size: clamp(31px, 5vw, 58px); line-height: 1.17; }
    .screen { overflow: hidden; width: min(72vw, 650px); aspect-ratio: 16/10; margin: 0 auto;
      border: 10px solid #fdf8ec; border-radius: 20px; background: #426d68;
      box-shadow: 0 30px 80px #382b2744; animation: enter-website 1.05s cubic-bezier(.22,1,.36,1) forwards; }
    .screen img { display: block; width: 100%; height: 100%; object-fit: cover; }
    .screen__fallback { display: grid; place-items: center; height: 100%; color: #f3e7c2; }
    .status { margin: 22px 0 0; font: 14px system-ui, sans-serif; color: #81674f; }
    .bar { width: 220px; height: 4px; margin: 16px auto 0; overflow: hidden; border-radius: 20px; background: #cbb78f; }
    .bar::after { content: ""; display: block; width: 100%; height: 100%; background: #426d68;
      transform-origin: left; animation: progress 1s linear forwards; }
    @keyframes enter-website { from { transform: translateY(25px) scale(.84) rotate(-1.5deg); filter: blur(3px); opacity: .4; }
      to { transform: translateY(0) scale(1.1); filter: blur(0); opacity: 1; } }
    @keyframes progress { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @media (prefers-reduced-motion: reduce) { .screen, .bar::after { animation: none; } }
  </style>
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <main class="shell">
    <p class="eyebrow">THE PROJECT ARCHIVE · PORTAL</p>
    <h1 id="title">Entering your next world</h1>
    <div class="screen" id="screen"><span class="screen__fallback">Opening live website ↗</span></div>
    <p class="status" id="status">Preparing the destination…</p>
    <div class="bar" aria-hidden="true"></div>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    const title = params.get('title') || 'Live project';
    const destination = params.get('to') || '';
    const preview = params.get('image') || '';
    document.getElementById('title').textContent = title;
    let url;
    try {
      url = new URL(destination, location.href);
      if (!['http:', 'https:'].includes(url.protocol)) throw new Error('Invalid URL');
    } catch {
      document.getElementById('status').textContent = 'Destination unavailable. You can close this tab.';
      throw new Error('Invalid project destination');
    }
    try {
      const screenshot = new URL(preview, location.href);
      if (['http:', 'https:'].includes(screenshot.protocol)) {
        const image = new Image();
        image.alt = `${title} website preview`;
        image.onload = () => document.getElementById('screen').replaceChildren(image);
        image.src = screenshot.href;
      }
    } catch { /* Keep fallback if no preview is available. */ }
    document.getElementById('status').textContent = `Connecting to ${url.host}…`;
    const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
    setTimeout(() => location.replace(url.href), reduced ? 100 : 1100);
  </script>
</body>
</html>
