<!doctype html>
<html lang="en" class="is-loading">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>3D | Ghannoum Portfolio</title>

    <link rel="stylesheet" href="/index.css" />
    <link rel="stylesheet" href="/src/ui/LoadingScreen.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Alex+Brush&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <noscript> JavaScript is required to explore this portfolio. </noscript>

    <!-- INTRODUCTION AND 3D WORLD -->
    <!-- <section class="world-mask_container"> -->
    <section id="world-entrance" class="world-entrance">
      <!-- Fixed-looking layer behind the introduction -->
      <div class="world-entrance__sticky">
        <!-- Defines the organic window shape. -->
        <svg
          class="world-entrance__mask-defs"
          width="0"
          height="0"
          aria-hidden="true"
          focusable="false"
        >
          <defs>
            <clipPath id="world-portal-clip" clipPathUnits="objectBoundingBox">
              <path
                id="world-portal-shape"
                d="
            M 0.18 0.30
            C 0.27 0.25, 0.36 0.33, 0.48 0.24
            C 0.62 0.14, 0.72 0.10, 0.80 0.17
            C 0.90 0.24, 0.94 0.39, 0.90 0.54
            C 0.88 0.70, 0.79 0.75, 0.67 0.76
            C 0.55 0.77, 0.44 0.85, 0.31 0.80
            C 0.18 0.77, 0.12 0.72, 0.13 0.61
            C 0.14 0.51, 0.20 0.44, 0.18 0.36
            C 0.17 0.34, 0.16 0.32, 0.18 0.30
            Z
          "
              />
            </clipPath>
          </defs>
        </svg>

        <!-- Your existing live Three.js world -->
        <div id="world-portal" class="world-entrance__portal">
          <canvas id="game"></canvas>
        </div>
      </div>

      <!-- Regular content that scrolls upward naturally -->

      <div class="world-entrance__intro">
        <div class="world-entrance__content">
          <p class="world-entrance__description">
            "You thought you were just visiting a portfolio? How foolish. You've
            entered MY domain. Here, I write the code, I make the rules, and
            even gravity needs my permission. Now... let's see how long you
            survive." [ SCROLL AND ACCEPT YOUR FATE ]
          </p>
        </div>
      </div>

      <p class="world-entrance__scroll-hint">Scroll to explore ↓</p>

      <!-- Invisible distance for the scroll animation -->
      <div class="world-entrance__scroll-space" aria-hidden="true"></div>
    </section>
    <!-- </section> -->
    <!-- YOUR EXISTING LOADING SCREEN -->
    <div id="loading-screen" class="loading-screen">
      <div class="loader">
        <div
          id="loading-progress"
          class="bar"
          role="progressbar"
          aria-label="Loading"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="0"
        >
          <div id="loading-progress-fill" class="fill"></div>
        </div>
      </div>

      <p class="loading-text" role="status" aria-live="polite">
        Entering the Portfolio...
      </p>

      <svg style="display: none">
        <filter id="wobble">
          <feTurbulence
            type="fractalNoise"
            baseFrequency="1"
            numOctaves="1"
            result="turbulence"
          ></feTurbulence>

          <feDisplacementMap
            in="SourceGraphic"
            in2="turbulence"
            scale="2"
          ></feDisplacementMap>
        </filter>
      </svg>
    </div>

    <!-- Reusable UI components -->
    <div id="ui-root"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
