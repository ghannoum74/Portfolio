<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>3D | Ghannoum Portfolio</title>

    <link rel="stylesheet" href="/index.css" />
    <link rel="stylesheet" href="/src/ui/LoadingScreen.css" />
  </head>

  <body>
    <noscript> JavaScript is required to explore this portfolio. </noscript>

    <canvas id="game"></canvas>

    <div id="loading-screen" class="loading-screen">
      <div class="loading-screen_content">
        <h1 class="loading-screen_title">Entering my world</h1>

        <p id="loading-status" class="loading-screen_status" aria-live="polite">
          Starting your adventure...
        </p>

        <div
          id="loading-progress"
          class="loading-screen_progress"
          role="progressbar"
          aria-label="3D asset loading progress"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="0"
        >
          <div
            id="loading-progress-fill"
            class="loading-screen_progress-fill"
          ></div>
        </div>

        <div class="loading-screen_details">
          <span id="loading-file"> Preparing assets </span>

          <span id="loading-count"> 0% of 3D assets </span>
        </div>

        <p
          id="loading-error"
          class="loading-screen_error"
          role="alert"
          hidden
        ></p>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
