<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>3D | Ghannoum Portfolio</title>

    <link rel="stylesheet" href="/index.css" />
    <link rel="stylesheet" href="/src/ui/LoadingScreen.css" />
  </head>

  <body>
    <noscript> JavaScript is required to explore this portfolio. </noscript>

    <canvas id="game"></canvas>

    <div id="loading-screen" class="loading-screen">
      <div class="loader">
        <div
          id="loading-progress"
          class="bar"
          role="progressbar"
          aria-label="Loading"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="0"
        >
          <div id="loading-progress-fill" class="fill"></div>
        </div>
      </div>
      <p class="loading-text">Entering the Portfolio...</p>
      <svg style="display: none">
        <filter id="wobble">
          <feTurbulence
            type="fractalNoise"
            baseFrequency="1"
            numOctaves="1"
            result="turbulence"
          ></feTurbulence>
          <feDisplacementMap
            in="SourceGraphic"
            in2="turbulence"
            scale="2"
          ></feDisplacementMap>
        </filter>
      </svg>
    </div>

    <div id="ui-root"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
